<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piracy Shield - Advanced Detection System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Logo/Brand -->
        <div class="brand-logo">
            <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="30" cy="30" r="28" stroke="url(#gradient)" stroke-width="2" />
                <path d="M30 15 L30 25 M30 35 L30 45" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round" />
                <circle cx="30" cy="30" r="3" fill="url(#gradient)" />
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0088cc" />
                        <stop offset="100%" style="stop-color:#00aaff" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Header Section -->
        <div class="header">
            <h1>Piracy Shield</h1>
            <p class="subtitle">Advanced AI-powered detection system for Telegram channels. Protect intellectual
                property with real-time scanning and metadata analysis.</p>
        </div>

        <!-- Search Form -->
        <form action="/scan" method="POST">
            <div class="form-group">
                <label for="movie_name">Search Content</label>
                <div class="input-wrapper">
                    <!-- Search Icon SVG -->
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="movie_name" name="movie_name" placeholder="Enter movie or file name..."
                        required autocomplete="off">
                </div>
            </div>
            <button type="submit" class="scan-button">
                <span class="button-content">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 11-6.219-8.56" />
                    </svg>
                    Initiate Scan
                </span>
            </button>
        </form>

        <!-- Error Message Display -->
        {% if error %}
        <div class="error-msg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Features Grid -->
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon-wrapper">
                    <svg class="feature-icon" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <span class="feature-text">Real-time Scan</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon-wrapper">
                    <svg class="feature-icon" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                    </svg>
                </div>
                <span class="feature-text">AI Powered</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon-wrapper">
                    <svg class="feature-icon" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <span class="feature-text">Metadata Analysis</span>
            </div>
        </div>

        <!-- Stats Footer -->
        <div class="stats-footer">
            <div class="stat-item">
                <div class="stat-value">99.2%</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-value">&lt;2s</div>
                <div class="stat-label">Scan Time</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <div class="stat-value">24/7</div>
                <div class="stat-label">Monitoring</div>
            </div>
        </div>
    </div>
</body>

</html>
